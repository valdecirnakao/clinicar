<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="max-width: 460px; width: 100%; border-radius: 14px;">
    <div class="card-body p-4">

      <div class="text-center mb-4" style="color: #35689b;">
        <img src="assets/img/LogoClinicar.png" class="recuperacao-logo" alt="CliniCar">
        <h4 class="mt-2 mb-1">Recuperar senha</h4>
        <p class="text-muted mb-0">
          Informe seu e-mail para receber o link de redefinição.
        </p>
      </div>

      @if (mensagemSucesso) {
        <div class="alert alert-success" [appFeedback]="mensagemSucesso" tipoFeedback="sucesso" (feedbackFechado)="mensagemSucesso = ''">
          {{ mensagemSucesso }}
        </div>
      }

      @if (mensagemErro) {
        <div class="alert alert-danger">
          {{ mensagemErro }}
        </div>
      }

      <form data-help-scope="esqueci-senha" (ngSubmit)="solicitarRedefinicao()">
        <app-field-help-panel></app-field-help-panel>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            placeholder="Digite seu e-mail cadastrado"
            [(ngModel)]="email"
            [disabled]="carregando"
            autocomplete="email"
            >
        </div>

        <button
          type="submit"
          class="btn w-100 text-white"
          style="background-color: #35689b;"
          [disabled]="carregando"
          >
          @if (!carregando) {
            <span>Enviar link de recuperação</span>
          }
          @if (carregando) {
            <span>
              <span class="spinner-border spinner-border-sm me-1"></span>
              Enviando...
            </span>
          }
        </button>

      </form>

      <div class="text-center mt-3">
        <a routerLink="/login" class="text-decoration-none">
          Voltar para o login
        </a>
      </div>

    </div>
  </div>
</div>
