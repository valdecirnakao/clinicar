name: clinicar

services:

  # ==========================================================
  # MYSQL
  # ==========================================================
  mysql:
    image: mysql:8.0.42
    container_name: clinicar-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: clinicar
      MYSQL_USER: clinicar_app

      # Valores abaixo sao apenas fallbacks do ambiente local/TCC.
      # Um arquivo .env pode sobrescreve-los.
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:-ClinicarLocalApp_2026}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-ClinicarLocalRoot_2026}"

      TZ: America/Sao_Paulo

    volumes:
      - mysql_data:/var/lib/mysql
      - ./bd/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql
          --protocol=TCP
          -h 127.0.0.1
          -P 3306
          -u"$$MYSQL_USER"
          "$$MYSQL_DATABASE"
          -Nse "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - clinicar-network


  # ==========================================================
  # MAILPIT
  # ==========================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: clinicar-mailpit
    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    networks:
      - clinicar-network


  # ==========================================================
  # BACKEND SPRING BOOT
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: clinicar-backend:local
    container_name: clinicar-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/clinicar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8"

      SPRING_DATASOURCE_USERNAME: clinicar_app
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_APP_PASSWORD:-ClinicarLocalApp_2026}"

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_FORMAT_SQL: "false"

      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: nao-responda@clinicar.local

      CLINICAR_FRONTEND_URL: "http://localhost"
      APP_PUBLIC_URL: "http://localhost"

      SETUP_TOKEN_MINUTES: "60"

      # Chave publica propositalmente reservada ao ambiente local academico.
      # Um .env real deve sobrescreve-la.
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-2bo80B/E9obAIHBIJcITMfj13y6pkl8PYjuFeD5G6cs=}"

      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax

      CLINICAR_WHATSAPP_ENABLED: "false"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"

      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/api/setup/status"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    depends_on:
      mysql:
        condition: service_healthy

      mailpit:
        condition: service_started

    networks:
      - clinicar-network


  # ==========================================================
  # FRONTEND ANGULAR + NGINX
  # ==========================================================
  frontend:
    build:
      context: ./frontend/clinicar
      dockerfile: Dockerfile

    image: clinicar-frontend:local
    container_name: clinicar-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - clinicar-network


# ============================================================
# VOLUME PERSISTENTE
# ============================================================
volumes:
  mysql_data:


# ============================================================
# REDE INTERNA
# ============================================================
networks:
  clinicar-network:
    driver: bridge