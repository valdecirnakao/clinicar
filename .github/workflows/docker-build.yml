name: Build and Push CliniCar Docker Images

on:
  push:
    branches:
      - main
      - desenvolvimento-pos-entrega

  workflow_dispatch:

  pull_request:
    branches: [main, desenvolvimento-pos-entrega]

jobs:
  quality:
    name: Testes e compilação
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha-apenas-ci
          MYSQL_DATABASE: modernizacao_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psenha-apenas-ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testar backend
        working-directory: backend
        run: bash mvnw -B verify
      - name: Validar migrações e transações no MySQL
        working-directory: backend
        env:
          CLINICAR_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/modernizacao_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
          CLINICAR_TEST_MYSQL_PASSWORD: senha-apenas-ci
        run: bash mvnw -B -Dtest=ModernizacaoMySqlIT test
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/clinicar/package-lock.json
      - name: Instalar frontend
        working-directory: frontend/clinicar
        run: npm ci
      - name: Testar frontend
        working-directory: frontend/clinicar
        env:
          CHROME_BIN: /usr/bin/google-chrome
          NG_CLI_ANALYTICS: 'false'
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Compilar frontend
        working-directory: frontend/clinicar
        run: npm run build
      - name: Validar configuração do servidor web
        working-directory: frontend/clinicar
        run: docker run --rm --add-host backend:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Preparar navegador de testes
        working-directory: frontend/clinicar
        run: npx playwright install --with-deps chromium
      - name: Testar navegação e formulários no navegador
        working-directory: frontend/clinicar
        run: npx playwright test

  build-and-push:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/backend-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/clinicar
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push MySQL
        uses: docker/build-push-action@v6
        with:
          context: ./bd
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mysql-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/mysql-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=mysql
          cache-to: type=gha,mode=max,scope=mysql
