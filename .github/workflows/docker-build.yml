name: Build and Push CliniCar Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/backend-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/clinicar
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push MySQL
        uses: docker/build-push-action@v6
        with:
          context: ./bd
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mysql-clinicar:latest
            ${{ secrets.DOCKER_USERNAME }}/mysql-clinicar:${{ github.sha }}
          cache-from: type=gha,scope=mysql
          cache-to: type=gha,mode=max,scope=mysql