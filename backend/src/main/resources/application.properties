# ===============================
# BANCO DE DADOS - MYSQL
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clinicar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo


# ===============================
# WHATSAPP CLOUD API - META
# ===============================

whatsapp.api-url=https://graph.facebook.com/v25.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# Template padrão, usado no método enviarMensagemTemplate()
whatsapp.template-name=cadastro_usuario

# Template usado no cadastro de veículo
whatsapp.template-cadastro-veiculo-name=cadastro_veiculo

# Idioma aprovado nos templates
whatsapp.template-language=pt_BR
meta.whatsapp.templates.alerta-manutencao=${WHATSAPP_TEMPLATE_ALERTA_MANUTENCAO:alerta_manutencao_preventiva}
clinicar.manutencao.whatsapp.habilitado=${CLINICAR_MANUTENCAO_WHATSAPP_HABILITADO:false}

# ===============================
# EMAIL - SMTP CONFIGURÁVEL (MAILPIT LOCAL POR PADRÃO)
# ===============================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# URL do frontend Angular
clinicar.frontend-url=${CLINICAR_FRONTEND_URL:http://localhost:4200}

# ===============================
# MFA / 2FA - TOTP
# ===============================
clinicar.mfa.issuer=CliniCar
clinicar.mfa.challenge-expiration-minutes=10
clinicar.mfa.encryption-key=${MFA_ENCRYPTION_KEY}

# ===============================
# SESSÃO / COOKIE SEGURO
# ===============================

clinicar.session.cookie-name=CLINICAR_SESSION
clinicar.session.expiration-hours=8

# Em localhost/http, uso false.
# Em produção após publicação na nuvem, com HTTPS, trocar para true.
clinicar.session.cookie-secure=${SESSION_COOKIE_SECURE:false}

# Recomendado para o cenário atual.
clinicar.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}
spring.jpa.open-in-view=false

# Um mecanismo de migração; bases legadas só recebem baseline após validação explícita.
spring.flyway.enabled=${CLINICAR_MIGRACOES_ENABLED:true}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=20
management.endpoints.web.base-path=/api/infra
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# ===============================
# WHATSAPP CLOUD API - ESTOQUE
# ===============================

clinicar.whatsapp.enabled=${CLINICAR_WHATSAPP_ENABLED:false}
clinicar.whatsapp.api-url=https://graph.facebook.com
clinicar.whatsapp.api-version=v23.0
clinicar.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
clinicar.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
clinicar.whatsapp.webhook.app-secret=${WHATSAPP_WEBHOOK_APP_SECRET:}
clinicar.whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# Template criado na Meta
clinicar.estoque.alerta.template=${CLINICAR_ESTOQUE_ALERTA_TEMPLATE:alerta_estoque_peca}
clinicar.estoque.alerta.idioma=${CLINICAR_ESTOQUE_ALERTA_IDIOMA:pt_BR}

# ===============================
# WHATSAPP CLOUD API - USUARIO
# ===============================

meta.whatsapp.template-language=pt_BR
meta.whatsapp.templates.alerta-ativa-usuario=alerta_ativa_usuario
meta.whatsapp.templates.alerta-atualiza-usuario=alerta_atualiza_usuario
meta.whatsapp.templates.alerta-redefine-2fa=alerta_redefine_2fa
meta.whatsapp.templates.alerta-inativa-usuario=alerta_inativa_usuario

# ===============================
# WHATSAPP CLOUD API - VEICULO
# ===============================

meta.whatsapp.template-language=pt_BR
meta.whatsapp.templates.alerta-atualiza-veiculo=atualizacao_veiculo
meta.whatsapp.templates.eliminacao-veiculo=eliminacao_veiculo
clinicar.whatsapp.avisos-servico-habilitados=${CLINICAR_WHATSAPP_AVISOS_SERVICO_HABILITADOS:false}

# ===============================
# VALIDADE DO TOKEN ALEATÓRIO CRIADO PARA O SETUP INICIAL DO SISTEMA
# ===============================

clinicar.setup.token-validade-minutos=${SETUP_TOKEN_MINUTES:60}
# Primeiro acesso: remetente e endereço público da aplicação
clinicar.mail.remetente=${MAIL_FROM:nao-responda@clinicar.local}
clinicar.app.public-url=${APP_PUBLIC_URL:${clinicar.frontend-url}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.flyway.placeholder-replacement=false
