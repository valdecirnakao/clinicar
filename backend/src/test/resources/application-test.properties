spring.datasource.url=jdbc:h2:mem:clinicar;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
clinicar.mfa.encryption-key=Q2xpbmljYXJFbnRyZWdhUGFyY2lhbE1GQUtleTIwMjY=
clinicar.manutencao.agendador-habilitado=false
clinicar.acesso.agendador-habilitado=false
clinicar.manutencao.whatsapp.habilitado=true

clinicar.estoque.agendador-habilitado=false

# Testes de negócio legados; a suíte CsrfConfigTest habilita e testa o filtro explicitamente.
clinicar.security.csrf-enabled=false
clinicar.security.rate-limit-enabled=false
spring.flyway.enabled=false

clinicar.notificacoes.outbox-enabled=false
clinicar.notificacoes.worker-enabled=false
clinicar.operacoes.confiaveis-enabled=false
clinicar.auditoria.cadastros-enabled=false
